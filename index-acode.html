<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Engr. James Tiongson Gabas | Digital Business Card</title>
<style>
:root{--bg:#101827;--card:#182236;--text:#f3f6fb;--muted:#a9b6cc;--accent:#38bdf8;--accent2:#818cf8}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(circle at 50% 0%,#1d2b4a 0%,var(--bg) 55%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);display:flex;justify-content:center}
.wrap{width:100%;max-width:420px;padding:28px 20px 40px;text-align:center}
.profile{position:relative;width:min(78vw,300px);aspect-ratio:4/5;margin:0 auto 22px;border-radius:28px;padding:4px;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 0 6px rgba(56,189,248,.15),0 18px 50px rgba(56,189,248,.35);animation:glow 3s ease-in-out infinite}
.profile img{width:100%;height:100%;object-fit:cover;object-position:50% 35%;border-radius:24px;display:block}
@keyframes glow{50%{box-shadow:0 0 0 10px rgba(129,140,248,.18),0 18px 60px rgba(129,140,248,.45)}}
h1{font-size:1.7rem;line-height:1.25;letter-spacing:.2px}
.role{color:var(--muted);margin:6px 0 24px;font-size:1rem}
.save{display:block;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06111f;font-weight:700;text-decoration:none;padding:15px;border-radius:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid a{background:var(--card);color:var(--text);text-decoration:none;padding:13px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.08);font-size:.95rem}
a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.thanks{color:var(--muted);margin-top:26px;font-size:.9rem}
@media (prefers-reduced-motion:reduce){.profile{animation:none}}
</style>
</head>
