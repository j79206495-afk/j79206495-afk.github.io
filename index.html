<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>James T. Gabas | Digital Business Card</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;
      color:#f7f9fc;background:linear-gradient(145deg,#101827,#172c48 55%,#243b63);
      display:flex;justify-content:center;align-items:center}
    .card{width:100%;max-width:440px;padding:30px 24px;border:1px solid #ffffff24;border-radius:26px;
      background:#ffffff12;box-shadow:0 18px 55px #0005;text-align:center;backdrop-filter:blur(12px)}
    .avatar{width:112px;height:112px;border-radius:50%;object-fit:cover;border:3px solid #ffffffb0;
      background:#dbeafe;margin:0 auto 16px;display:block}
    .initials{display:none;width:112px;height:112px;border-radius:50%;margin:0 auto 16px;
      background:#dbeafe;color:#183153;font-size:34px;font-weight:700;align-items:center;justify-content:center}
    h1{font-size:27px;margin:8px 0 6px}
    .subtitle{color:#d4e2f5;margin:0 0 22px;font-size:14px;line-height:1.5}
    .links{display:grid;gap:11px}
    .btn{display:block;padding:14px 16px;border-radius:13px;text-decoration:none;color:#142238;
      background:#f7fbff;font-weight:700;transition:transform .15s,background .15s}
    .btn:hover{transform:translateY(-2px);background:#dcecff}
    .btn.primary{background:#8bd3ff}
    .section{margin-top:24px;padding-top:20px;border-top:1px solid #ffffff2b}
    .section h2{font-size:16px;margin:0 0 13px}
    .qr{width:164px;height:164px;padding:8px;background:#fff;border-radius:12px}
    .small{font-size:12px;color:#d4e2f5;line-height:1.5;margin:10px 0 0}
    footer{font-size:11px;color:#c0cee0;margin-top:20px}
  </style>
</head>
<body>
  <main class="card">
    <img class="avatar" src="profile.jpg" alt="James T. Gabas"
         onerror="this.style.display='none';document.getElementById('initials').style.display='flex'">
    <div class="initials" id="initials">JG</div>
    <h1>James T. Gabas</h1>
    <p class="subtitle">Electrical Engineering Student<br>Digital Business Card</p>

    <div class="links">
      <a class="btn primary" href="james-gabas.vcf" download>Save Contact</a>
      <a class="btn" href="tel:+639207724994">📞 Phone</a>
      <a class="btn" href="mailto:jamesgabas85@gmail.com">✉️ Email</a>
      <a class="btn" href="https://www.facebook.com/share/1MJzKPGMtL/" target="_blank" rel="noopener">Facebook</a>
      <a class="btn" href="https://www.instagram.com/javex_08?obrf=Zm5xOXE4dzhrMDA0" target="_blank" rel="noopener">Instagram</a>
      <a class="btn" href="https://m.me/Javex02" target="_blank" rel="noopener">Messenger</a>
      <a class="btn" href="https://wa.me/639207724994?s=t" target="_blank" rel="noopener">WhatsApp</a>
      <a class="btn" href="https://t.me/javeue" target="_blank" rel="noopener">Telegram</a>
    </div>

    <section class="section">
      <h2>Scan My Digital Business Card</h2>
      <img class="qr" src="qrcode.png" alt="QR code linking to James T. Gabas digital business card">
      <p class="small">Scan the QR code to open this digital business card.</p>
    </section>
    <footer>Thank you for connecting!</footer>
  </main>
</body>
</html>
