<!DOCTYPE html>

<style>
:root{--bg:#0b1220;--panel:#121b2e;--line:#243250;--text:#f2f5fa;--muted:#9aa8c2;--amber:#ffb81c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.card{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg)}

/* Hero: profile photo is framed, glowing and spotlit */
.hero{position:relative;padding:34px 22px 18px;text-align:center;background:radial-gradient(ellipse at 50% 38%,rgba(255,184,28,.28) 0%,rgba(255,184,28,.08) 45%,rgba(11,18,32,0) 72%)}
.frame{width:min(78%,340px);aspect-ratio:4/5;margin:0 auto;border-radius:26px;padding:4px;background:linear-gradient(160deg,#ffd66b,var(--amber) 45%,#c98600);box-shadow:0 0 0 8px rgba(255,184,28,.14),0 0 70px rgba(255,184,28,.5),0 24px 50px rgba(0,0,0,.55);animation:glow 3.2s ease-in-out infinite}
.frame img{width:100%;height:100%;object-fit:cover;object-position:50% 45%;border-radius:22px;display:block}
@keyframes glow{50%{box-shadow:0 0 0 12px rgba(255,184,28,.2),0 0 95px rgba(255,184,28,.65),0 24px 50px rgba(0,0,0,.55)}}
.id{margin-top:26px}
.id h1{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;font-weight:700;font-size:clamp(2.2rem,10.5vw,3rem);line-height:1;letter-spacing:.2px}
.id p{margin-top:10px;color:var(--amber);font-weight:600;font-size:1.05rem}

/* One moment of motion: a current line drawn under the photo */
.wire{display:block;width:100%;height:14px}
.wire path{fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:520;stroke-dashoffset:520;animation:draw 1.4s .3s ease-out forwards}
.wire circle{fill:var(--amber);opacity:0;animation:pop .2s 1.6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}

.body{padding:6px 22px 40px}
.save{display:block;text-align:center;background:var(--amber);color:#1a1300;font-weight:600;font-size:1.05rem;text-decoration:none;padding:16px;border-radius:10px;margin:14px 0 26px}
.group{margin-bottom:24px}
.group h2{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:1.15rem;color:var(--muted);margin-bottom:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 2px;border-top:1px solid var(--line);color:var(--text);text-decoration:none}
.row:last-child{border-bottom:1px solid var(--line)}
.row b{font-weight:600}
.row span{color:var(--muted);font-size:.95rem;text-align:right;overflow-wrap:anywhere}
.row:active{background:var(--panel)}
a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.thanks{text-align:center;color:var(--muted);font-size:.92rem;margin-top:8px}
@media (min-width:520px){.card{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){.frame{animation:none}.wire path{animation:none;stroke-dashoffset:0}.wire circle{animation:none;opacity:1}}
</style>
</head>
<body>
